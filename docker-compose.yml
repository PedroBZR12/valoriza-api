version: '3.8'

services:
  web:
    build: .
    working_dir: /app/api
    command: python manage.py runserver 0.0.0.0:4323
    volumes:
      - .:/app
    ports:
      - "4323:4323"
    environment:
      - DEBUG=1
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=django_password

volumes:
  postgres_data: