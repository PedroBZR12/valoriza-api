services:
  web:
    build: .
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:4323
    volumes:
      - .:/app
    ports:
      - "4323:4323"
    env_file:
      - .env
    environment:
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - valoriza-network

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: valoriza
      POSTGRES_USER: valoriza
      POSTGRES_PASSWORD: valoriza
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valoriza -d valoriza"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - valoriza-network

networks:
  valoriza-network:
    driver: bridge

volumes:
  postgres_data: