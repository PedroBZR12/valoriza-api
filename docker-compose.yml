version: '3.8'

services:
  web:
    build: .
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:4323
    volumes:
      - .:/app
    ports:
      - "4323:4323"
    environment:
      - DEBUG=1
    depends_on:
      - db

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: valoriza
      POSTGRES_USER: valoriza
      POSTGRES_PASSWORD: valoriza
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: